<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<meta name="referrer" content="no-referrer" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c0b10'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffb168'/%3E%3C/svg%3E" />
<title>올해의 리뷰</title>

<!--
  리뷰 페이지 템플릿 — 빌드 없음, 외부 요청 없음.
  이 파일은 고치지 않아도 됩니다. 내용은 옆의 두 파일에서 옵니다.
    data.js      설문 CSV에서 자동 생성 (review-page/build.mjs)
    analysis.js  주제 분류·한 문장 요약 (사람/Claude가 작성)
  폰트도 CDN을 쓰지 않습니다. 행사장 네트워크가 막혀도 그대로 뜹니다.
-->

<style>
:root{
  --bg:#0c0b10;
  --bg-soft:#131219;
  --surface:rgba(255,255,255,.045);
  --surface-2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.10);
  --line-strong:rgba(255,255,255,.18);
  --text:#f3f0ea;
  --muted:#a29daf;
  --dim:#6f6a7c;
  --amber:#ffb168;
  --mint:#74ddbd;
  --lilac:#b9a1ff;
  --rose:#ff8fa8;
  --accent:var(--amber);
  --maxw:1080px;
  --pad:clamp(20px,5vw,64px);
  --r:18px;
  --ease:cubic-bezier(.22,.8,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{
  scroll-behavior:smooth;
  scroll-snap-type:y proximity;
  -webkit-text-size-adjust:100%;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:17px;
  line-height:1.72;
  letter-spacing:-.011em;
  word-break:keep-all;
  overflow-wrap:anywhere;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;scroll-snap-type:none}
  *{animation:none!important;transition:none!important}
}

/* 배경의 옅은 빛 — 섹션마다 색이 바뀐다 */
.glow{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60vw 50vh at 78% 8%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
    radial-gradient(52vw 46vh at 12% 88%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 72%);
  transition:background 1.1s var(--ease);
}
.grain{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
  background-size:3px 3px;
}

/* 상단 진행 바 */
.progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:60;background:var(--accent);transition:width .25s linear,background .8s var(--ease)}

/* 리허설 데이터 경고 띠 */
.sample-flag{
  position:fixed;top:0;left:0;right:0;z-index:70;
  background:#c0392b;color:#fff;text-align:center;
  font-size:13px;font-weight:700;letter-spacing:.02em;padding:5px 12px;
}
.sample-flag[hidden]{display:none}
body.has-flag .progress{top:28px}

/* 우측 점 네비 */
.dots{
  position:fixed;right:max(14px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);
  z-index:50;display:flex;flex-direction:column;gap:14px;align-items:flex-end;
}
.dots button{
  all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;color:var(--dim);
  font-size:12px;letter-spacing:.02em;
}
.dots .label{opacity:0;transform:translateX(6px);transition:all .3s var(--ease);white-space:nowrap}
.dots button:hover .label,.dots button:focus-visible .label{opacity:1;transform:none;color:var(--muted)}
.dots .pip{width:7px;height:7px;border-radius:50%;background:var(--line-strong);transition:all .35s var(--ease);flex:none}
.dots button[aria-current="true"] .pip{background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.dots button[aria-current="true"] .label{opacity:1;transform:none;color:var(--text)}
@media (max-width:760px){.dots{display:none}}

/* 섹션 공통 */
main{position:relative;z-index:1}
.sec{
  min-height:100svh;scroll-snap-align:start;scroll-margin-top:0;
  padding:clamp(72px,11vh,120px) var(--pad) clamp(56px,9vh,96px);
  display:flex;flex-direction:column;justify-content:center;
  border-top:1px solid transparent;
}
.sec>.inner{width:100%;max-width:var(--maxw);margin:0 auto}
.sec+.sec{border-top-color:var(--line)}

.eyebrow{
  display:inline-flex;align-items:center;gap:10px;
  font-size:12.5px;font-weight:700;letter-spacing:.16em;color:var(--accent);
  text-transform:uppercase;margin:0 0 18px;
}
.eyebrow::before{content:"";width:22px;height:1px;background:currentColor;opacity:.6}
h1{font-size:clamp(38px,8.2vw,80px);line-height:1.1;letter-spacing:-.035em;font-weight:800;margin:0}
h2{font-size:clamp(28px,4.6vw,48px);line-height:1.18;letter-spacing:-.03em;font-weight:750;margin:0 0 14px}
h3{font-size:clamp(19px,2.3vw,25px);line-height:1.3;letter-spacing:-.02em;font-weight:700;margin:0}
.lede{font-size:clamp(16px,1.9vw,20px);color:var(--muted);margin:0 0 clamp(28px,4vh,48px);max-width:62ch}

/* 등장 애니메이션 */
.rise{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.sec.on .rise{opacity:1;transform:none}
.sec.on .rise:nth-child(2){transition-delay:.06s}
.sec.on .rise:nth-child(3){transition-delay:.12s}
.sec.on .rise:nth-child(4){transition-delay:.18s}

/* ── 표지 ── */
#sec-hero{justify-content:center;text-align:left}
#sec-hero .kicker{font-size:clamp(13px,1.6vw,15px);letter-spacing:.24em;color:var(--accent);font-weight:700;margin:0 0 22px}
#sec-hero .meta{margin-top:clamp(34px,6vh,56px);display:flex;flex-wrap:wrap;gap:10px}
.chip{
  border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:7px 15px;font-size:13.5px;color:var(--muted);white-space:nowrap;
}
.scroll-hint{
  margin-top:clamp(36px,7vh,64px);display:flex;align-items:center;gap:12px;
  color:var(--dim);font-size:13px;letter-spacing:.06em;
}
.scroll-hint .bar{width:1px;height:34px;background:linear-gradient(var(--accent),transparent);animation:drop 2.1s var(--ease) infinite}
@keyframes drop{0%{transform:scaleY(.2);transform-origin:top;opacity:0}40%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);transform-origin:bottom;opacity:0}}

/* ── 통계 ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:clamp(20px,2.6vw,30px)}
.stat .n{font-size:clamp(38px,6.4vw,62px);font-weight:800;line-height:1;letter-spacing:-.045em;color:var(--accent);font-variant-numeric:tabular-nums}
.stat .n small{font-size:.38em;font-weight:700;letter-spacing:0;color:var(--muted);margin-left:5px}
.stat .k{margin-top:12px;font-size:14px;color:var(--muted)}
.note{margin-top:26px;font-size:14.5px;color:var(--dim);max-width:58ch}

/* ── 주제 묶음 (섹션 2·4) ── */
.groups{display:flex;flex-direction:column;gap:clamp(22px,3.4vh,40px)}
.group{border-left:2px solid color-mix(in srgb,var(--accent) 55%,transparent);padding-left:clamp(16px,2.4vw,26px)}
.group-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.count{
  font-size:12.5px;font-weight:700;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 38%,transparent);
  border-radius:999px;padding:3px 11px;letter-spacing:.02em;flex:none;
}
.group .summary{color:var(--muted);margin:0 0 16px;font-size:15.5px;max-width:64ch}
.quotes{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.quote{
  border:1px solid var(--line);background:var(--surface);border-radius:14px;
  padding:clamp(16px,2vw,22px);transition:border-color .3s var(--ease),background .3s var(--ease);
}
.quote:hover{border-color:var(--line-strong);background:var(--surface-2)}
.quote p{margin:0;font-size:15.5px;line-height:1.7}
.quote .who{margin-top:12px;font-size:13.5px;color:var(--accent);font-weight:650;letter-spacing:.01em}
.others{margin-top:14px;font-size:13.5px;color:var(--dim)}
.others b{color:var(--muted);font-weight:600}

/* ── 고마운 사람들 (섹션 3) ── */
.podium{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr));margin-bottom:clamp(22px,3vh,34px)}
.person{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r);
  padding:clamp(18px,2.2vw,26px);display:flex;flex-direction:column;gap:14px;
}
.person.top{
  border-color:color-mix(in srgb,var(--accent) 42%,transparent);
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 12%,transparent),var(--surface) 62%);
}
.person-head{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.person-head .name{font-size:clamp(20px,2.4vw,27px);font-weight:750;letter-spacing:-.02em}
.msgs{display:flex;flex-direction:column;gap:11px;margin:0;padding:0;list-style:none}
.msg{border-top:1px solid var(--line);padding-top:11px;font-size:15px;line-height:1.66;color:#e6e2dc}
.msg:first-child{border-top:0;padding-top:0}
.msg .from{display:block;margin-top:6px;font-size:13px;color:var(--dim)}
.rest{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.leftover{margin-top:clamp(22px,3vh,32px);border:1px dashed var(--line-strong);border-radius:var(--r);padding:clamp(16px,2vw,24px)}
.leftover h3{font-size:16px;margin-bottom:12px;color:var(--muted)}

/* ── 한 문장 (섹션 5) ── */
#sec-oneliner{text-align:center;align-items:center}
#sec-oneliner .inner{max-width:900px}
.bigline{
  font-size:clamp(28px,5.4vw,58px);line-height:1.26;letter-spacing:-.035em;font-weight:800;
  margin:clamp(18px,3vh,32px) 0;
  background:linear-gradient(100deg,var(--text) 18%,var(--accent) 108%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.bigline.empty{color:var(--dim);background:none;-webkit-text-fill-color:currentColor;font-weight:600;font-size:clamp(19px,2.6vw,26px)}
#sec-oneliner .after{color:var(--muted);max-width:58ch;margin:0 auto}

/* ── 푸터 ── */
footer{
  position:relative;z-index:1;border-top:1px solid var(--line);
  padding:44px var(--pad) calc(44px + env(safe-area-inset-bottom));
  display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;
  color:var(--dim);font-size:13.5px;max-width:var(--maxw);margin:0 auto;
}
footer button{
  all:unset;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:8px 16px;
  color:var(--muted);font-size:13px;transition:all .25s var(--ease);
}
footer button:hover{border-color:var(--accent);color:var(--accent)}

.empty-state{color:var(--dim);border:1px dashed var(--line-strong);border-radius:var(--r);padding:26px;font-size:15px}
.skip{position:absolute;left:-9999px}
.skip:focus{left:var(--pad);top:12px;z-index:80;background:var(--bg-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 16px}
</style>
</head>

<body>
<div class="glow" id="glow"></div>
<div class="grain"></div>
<div class="progress" id="progress"></div>
<div class="sample-flag" id="sampleFlag" hidden>리허설 데이터입니다 — 실제 응답으로 교체 후 배포하세요</div>
<a class="skip" href="#sec-stats">본문으로 건너뛰기</a>

<nav class="dots" id="dots" aria-label="섹션 이동"></nav>

<main id="main"></main>

<footer>
  <span id="footNote"></span>
  <button type="button" id="copyLink">링크 복사</button>
</footer>

<script src="./data.js"></script>
<script src="./analysis.js"></script>
<script>
(function () {
  'use strict';

  var DATA = window.REVIEW_DATA || { meta: {}, responses: [], thanks: [] };
  var A = window.REVIEW_ANALYSIS || {};
  var meta = DATA.meta || {};
  var responses = DATA.responses || [];
  var thanks = DATA.thanks || [];

  /* ── 작은 도구들 ── */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]);
    return parent;
  }
  function fmtDate(iso) {
    if (!iso) return '';
    var p = String(iso).slice(0, 10).split('-');
    return p.length === 3 ? p[0] + '년 ' + Number(p[1]) + '월 ' + Number(p[2]) + '일' : iso;
  }

  /* ── 섹션 3 데이터: 지목받은 사람 기준으로 감사 문장을 모은다 ──
     q2_reveal 이 거짓이면 build.mjs 가 from 을 아예 null 로 내보낸다.
     화면에서도 from 이 있을 때만 이름을 붙인다 — 조건은 여기 한 곳뿐이다. */
  function groupThanks() {
    var byName = {};
    var order = [];
    var orphans = [];
    thanks.forEach(function (t) {
      var to = t.to || [];
      if (!to.length) { orphans.push(t); return; }
      to.forEach(function (name) {
        if (!byName[name]) { byName[name] = []; order.push(name); }
        byName[name].push({ text: t.text, from: t.from || null });
      });
    });
    var people = order.map(function (name) { return { name: name, msgs: byName[name] }; });
    people.sort(function (a, b) {
      return b.msgs.length - a.msgs.length || a.name.localeCompare(b.name, 'ko');
    });
    return { people: people, orphans: orphans };
  }

  /* ── 분석 결과가 비어 있을 때의 대비 ──
     주제 분류를 못 채운 채로 당일을 맞아도 원문은 그대로 나온다. */
  function fallbackGroups(field, title) {
    var items = responses.filter(function (r) { return r[field]; });
    if (!items.length) return [];
    return [{
      title: title,
      summary: '주제 분류 전입니다. 들어온 응답을 그대로 싣습니다.',
      quotes: items.map(function (r) { return { name: r.name, text: r[field] }; }),
      others: [],
    }];
  }

  /* ── 섹션 만들기 ── */
  var main = document.getElementById('main');
  var sections = [];

  function section(id, navLabel, accent, build) {
    var s = el('section', 'sec');
    s.id = 'sec-' + id;
    s.dataset.accent = accent;
    var inner = el('div', 'inner');
    s.appendChild(inner);
    build(inner);
    main.appendChild(s);
    sections.push({ node: s, label: navLabel, accent: accent });
    return s;
  }

  function head(inner, eyebrow, title, lede) {
    add(inner, el('p', 'eyebrow rise', eyebrow), el('h2', 'rise', title));
    if (lede) add(inner, el('p', 'lede rise', lede));
  }

  function quoteCard(q) {
    var c = el('div', 'quote');
    add(c, el('p', null, q.text));
    if (q.name) add(c, el('div', 'who', q.name));
    return c;
  }

  function renderGroups(inner, groups, showCount) {
    var wrap = el('div', 'groups rise');
    groups.forEach(function (g) {
      var box = el('div', 'group');
      var h = el('div', 'group-head');
      add(h, el('h3', null, g.title));
      var n = showCount ? (g.count != null ? g.count : (g.quotes || []).length) : null;
      if (n) add(h, el('span', 'count', n + '명'));
      add(box, h);
      if (g.summary) add(box, el('p', 'summary', g.summary));
      if ((g.quotes || []).length) {
        var qs = el('div', 'quotes');
        g.quotes.forEach(function (q) { add(qs, quoteCard(q)); });
        add(box, qs);
      }
      if ((g.others || []).length) {
        var o = el('div', 'others');
        add(o, el('b', null, '함께한 사람 '), document.createTextNode(g.others.join(' · ')));
        add(box, o);
      }
      add(wrap, box);
    });
    add(inner, wrap);
  }

  /* 0. 표지 */
  section('hero', '표지', 'amber', function (inner) {
    add(inner,
      el('p', 'kicker rise', meta.title || 'TEAM REVIEW'),
      el('h1', 'rise', meta.subtitle || '올해 우리가 만든 장면들'));
    var m = el('div', 'meta rise');
    if (meta.eventDate) add(m, el('span', 'chip', fmtDate(meta.eventDate)));
    add(m, el('span', 'chip', '응답 ' + (meta.respondents || responses.length) + '명'));
    add(m, el('span', 'chip', '5개 섹션 · 약 26분'));
    add(inner, m);
    var hint = el('div', 'scroll-hint rise');
    add(hint, el('span', 'bar'), el('span', null, '아래로 넘기세요'));
    add(inner, hint);
  });

  /* 1. 응답 현황 */
  section('stats', '응답 현황', 'amber', function (inner) {
    var g = groupThanks();
    var total = meta.totalMembers || responses.length;
    var joined = meta.respondents || responses.length;
    head(inner, 'Section 01', '응답 현황', '설문에 들어온 응답입니다. 숫자만 짧게 보고 넘어갑니다.');
    var s = el('div', 'stats rise');
    [
      [joined, '명', total + '명 중 응답'],
      [responses.filter(function (r) { return r.q1_proud; }).length, '개', '올해의 장면'],
      [thanks.length, '개', '감사 인사'],
      [g.people.length, '명', '이름이 불린 사람'],
      [responses.filter(function (r) { return r.q3_change; }).length, '개', '바꾸고 싶은 것'],
    ].forEach(function (row) {
      var box = el('div', 'stat');
      var n = el('div', 'n', String(row[0]));
      add(n, el('small', null, row[1]));
      add(box, n, el('div', 'k', row[2]));
      add(s, box);
    });
    add(inner, s);
    if (total > joined) {
      add(inner, el('p', 'note rise', total + '명 중 ' + joined + '명이 답했습니다. 못 쓴 이야기는 오늘 자리에서 말로 채우면 됩니다.'));
    }
  });

  /* 2. 올해의 장면 */
  section('proud', '올해의 장면', 'mint', function (inner) {
    var groups = (A.proudGroups || []).length ? A.proudGroups : fallbackGroups('q1_proud', '올해의 장면');
    head(inner, 'Section 02', '올해의 장면',
      '「나 이건 잘했어요」에 들어온 이야기를 주제별로 묶었습니다.');
    if (!groups.length) { add(inner, el('div', 'empty-state rise', '아직 응답이 없습니다.')); return; }
    renderGroups(inner, groups, false);
  });

  /* 3. 고마운 사람들 */
  section('thanks', '고마운 사람들', 'rose', function (inner) {
    var g = groupThanks();
    head(inner, 'Section 03', '고마운 사람들',
      '이름이 불린 사람 기준으로 모았습니다. 먼저 각자 폰으로 2분 훑고, 위쪽 몇 분만 소리 내어 읽습니다.');
    if (!g.people.length && !g.orphans.length) {
      add(inner, el('div', 'empty-state rise', '아직 감사 인사가 없습니다.'));
      return;
    }

    function personCard(p, isTop) {
      var c = el('div', 'person' + (isTop ? ' top' : ''));
      var h = el('div', 'person-head');
      add(h, el('span', 'name', p.name), el('span', 'count', p.msgs.length + '명이 남김'));
      add(c, h);
      var ul = el('ul', 'msgs');
      p.msgs.forEach(function (m) {
        var li = el('li', 'msg', m.text);
        if (m.from) add(li, el('span', 'from', '— ' + m.from));
        add(ul, li);
      });
      add(c, ul);
      return c;
    }

    // 지목을 가장 많이 받은 사람들을 위에 크게. 2명 이상 받은 사람이 기준이고,
    // 그런 사람이 없으면 상위 3명을 올린다.
    var topCut = g.people.filter(function (p) { return p.msgs.length >= 2; }).slice(0, 4);
    if (!topCut.length) topCut = g.people.slice(0, 3);
    var rest = g.people.filter(function (p) { return topCut.indexOf(p) < 0; });

    if (topCut.length) {
      var pod = el('div', 'podium rise');
      topCut.forEach(function (p) { add(pod, personCard(p, true)); });
      add(inner, pod);
    }
    if (rest.length) {
      var r = el('div', 'rest rise');
      rest.forEach(function (p) { add(r, personCard(p, false)); });
      add(inner, r);
    }
    if (g.orphans.length) {
      // 명단에서 대상을 못 찾은 문장도 버리지 않는다.
      var box = el('div', 'leftover rise');
      add(box, el('h3', null, '그리고 이런 인사도 있었습니다'));
      var ul = el('ul', 'msgs');
      g.orphans.forEach(function (t) {
        var li = el('li', 'msg', t.text);
        if (t.from) add(li, el('span', 'from', '— ' + t.from));
        add(ul, li);
      });
      add(box, ul);
      add(inner, box);
    }
  });

  /* 4. 바꾸고 싶은 것 */
  section('change', '바꾸고 싶은 것', 'lilac', function (inner) {
    var groups = (A.changeGroups || []).slice();
    if (!groups.length) groups = fallbackGroups('q3_change', '바꾸고 싶은 것');
    else groups.sort(function (a, b) { return (b.count || 0) - (a.count || 0); });
    head(inner, 'Section 04', '바꾸고 싶은 것',
      '「내년에 바꿨으면 하는 한 가지」를 주제별로 묶고 많이 나온 순서로 놓았습니다.');
    if (!groups.length) { add(inner, el('div', 'empty-state rise', '아직 응답이 없습니다.')); return; }
    renderGroups(inner, groups, true);
  });

  /* 5. 내년 우리 팀 한 문장 */
  section('oneliner', '한 문장', 'amber', function (inner) {
    add(inner, el('p', 'eyebrow rise', 'Section 05'));
    var line = A.oneLiner
      ? el('p', 'bigline rise', A.oneLiner)
      : el('p', 'bigline empty rise', '내년 우리 팀을 한 문장으로 — 이 자리에서 함께 채웁니다.');
    add(inner, line);
    add(inner, el('p', 'after rise', A.oneLinerNote || '오늘 나온 이야기는 그대로 남습니다. 이 링크는 행사 후에도 열립니다.'));
  });

  /* ── 점 네비 ── */
  var dots = document.getElementById('dots');
  sections.forEach(function (s, i) {
    var b = el('button');
    b.type = 'button';
    b.setAttribute('aria-label', s.label + ' 섹션으로 이동');
    add(b, el('span', 'label', s.label), el('span', 'pip'));
    b.addEventListener('click', function () { go(i); });
    add(dots, b);
    s.button = b;
  });

  function go(i) {
    var n = Math.max(0, Math.min(sections.length - 1, i));
    sections[n].node.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function current() {
    var mid = window.innerHeight * 0.4;
    for (var i = sections.length - 1; i >= 0; i--) {
      if (sections[i].node.getBoundingClientRect().top <= mid) return i;
    }
    return 0;
  }

  /* ── 색·진행바·등장 ── */
  var glow = document.getElementById('glow');
  var bar = document.getElementById('progress');
  var active = -1;

  function paint() {
    var i = current();
    if (i !== active) {
      active = i;
      document.documentElement.style.setProperty('--accent', 'var(--' + sections[i].accent + ')');
      sections.forEach(function (s, n) { s.button.setAttribute('aria-current', n === i ? 'true' : 'false'); });
    }
    var h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
  }

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting) e.target.classList.add('on'); });
  }, { rootMargin: '-12% 0px -12% 0px' });
  sections.forEach(function (s) { io.observe(s.node); });

  var ticking = false;
  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { paint(); ticking = false; });
  }, { passive: true });
  window.addEventListener('resize', paint);

  /* ── 키보드 (큰 화면 진행용) ── */
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowDown' || k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(current() + 1); }
    else if (k === 'ArrowUp' || k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(current() - 1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(sections.length - 1); }
    else if (k === 'f' || k === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    }
  });

  /* ── 푸터 ── */
  var foot = document.getElementById('footNote');
  foot.textContent = (meta.title || '') + (meta.eventDate ? ' · ' + fmtDate(meta.eventDate) : '');
  document.getElementById('copyLink').addEventListener('click', function (e) {
    var btn = e.currentTarget;
    var done = function () { btn.textContent = '복사했습니다'; setTimeout(function () { btn.textContent = '링크 복사'; }, 1800); };
    if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done, done);
    else done();
  });

  // 상단 경고 띠 — 리허설 데이터이거나, 분석 파일이 이전 데이터 기준일 때.
  var flags = [];
  if (meta.sample) flags.push('리허설 데이터입니다 — 실제 응답으로 교체 후 배포하세요');
  if (A.forDataKey && meta.dataKey && A.forDataKey !== meta.dataKey) {
    flags.push('analysis.js 가 이전 데이터 기준입니다 — 주제 분류를 다시 채우세요');
  }
  if (flags.length) {
    var flag = document.getElementById('sampleFlag');
    flag.textContent = flags.join('  ·  ');
    flag.hidden = false;
    document.body.classList.add('has-flag');
  }
  if (meta.title) document.title = meta.title + ' — 리뷰';

  sections[0].node.classList.add('on');
  paint();
})();
</script>
</body>
</html>
